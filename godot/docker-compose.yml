#  Volumes carry `:z` so SELinux hosts (Fedora, RHEL) let the container read
#  them; Docker Desktop ignores it. `user:` keeps the files Godot writes
#  (.godot/, web_export/) owned by you rather than root on Linux — the tools
#  in tools/ set HOST_UID/HOST_GID, and the 1000 default suits most desktops.
x-godot: &godot
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /project

services:
  # Headless: the physics test and anything else that just needs the engine.
  #   docker compose run --rm godot --headless --quit-after 2000 -- --smoke
  godot:
    <<: *godot
    build:
      context: .
      target: base
    image: barbilliards-godot:4.3
    volumes:
      - .:/project:z

  # Watch it, and play it, in a browser at http://localhost:6080/vnc.html
  #   docker compose --profile vnc up godot-vnc
  godot-vnc:
    <<: *godot
    profiles: ["vnc"]
    build:
      context: .
      target: vnc
    image: barbilliards-godot:4.3-vnc
    volumes:
      - .:/project:z
    ports:
      - "127.0.0.1:6080:6080"
      - "127.0.0.1:5900:5900"

  # Only built when asked for: adds a ~1 GB export-templates layer.
  #   docker compose --profile web build godot-web
  # The export lands in ../web_export (the preset's export_path), so that is
  # mounted where the project's parent would be.
  godot-web:
    <<: *godot
    profiles: ["web"]
    build:
      context: .
      target: web
    image: barbilliards-godot:4.3-web
    volumes:
      - .:/project:z
      - ../web_export:/web_export:z

  # Serves the exported build for manual play.
  #   docker compose --profile web up web-static  ->  http://localhost:8070
  web-static:
    profiles: ["web"]
    image: python:3.12-slim
    volumes:
      - ../web_export:/web_export:ro,z
    working_dir: /web_export
    command: ["python3", "-m", "http.server", "8070"]
    ports:
      - "127.0.0.1:8070:8070"
